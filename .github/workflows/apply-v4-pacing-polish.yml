name: apply-v4-pacing-polish

on:
  push:
    branches: [v4-pacing-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: python3 .github/scripts/apply_v4_pacing.py
      - name: Commit patched game
        run: |
          git config user.name "SpaceMania Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "SpaceMania v4: deepen pacing, anticipation and route discovery [skip ci]"
          git push
      - name: Remove one-shot patcher
        run: |
          git rm -f .github/scripts/apply_v4_pacing.py .github/workflows/apply-v4-pacing-polish.yml
          git commit -m "chore: remove one-shot v4 pacing patcher [skip ci]"
          git push